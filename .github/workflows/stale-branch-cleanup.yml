name: stale-branch-cleanup
# 一次性:刪除 2026-08-01 盤點核可的舊分支(見 state/branch-cleanup-2026-08-01.md)
# 跑完即可把本檔從分支上移除
on:
  push:
    branches: [claude/github-branch-cleanup-f4ueii]
permissions:
  contents: write
jobs:
  delete-stale-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete vetted stale branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          for b in \
            article-map-and-obligation \
            ch3-postscript \
            cleanup-daily-fossils \
            index-card-ch3 \
            sop-v2.9-fixes \
            claude/add-middle-ground-card-Z2teT \
            claude/add-moon-rhythm-tracker-hdlqZ \
            claude/add-publication-card-U4LXS \
            claude/anthropic-ai-moratorium-claim-0OLIG \
            claude/conversation-redaction-issue-3q64rg \
            claude/interview-signa-timeline-ikfes0 \
            claude/israeli-scarf-import-z5LRz \
            claude/pages-cache-delay-verification-mlwr6p \
            claude/price-card-reports-publications-o2v3ye \
            claude/stance-rules-docs-ff3t3i \
            claude/standalone-cocreation-app-939vhb \
            claude/syntax-archive-index-gsluks \
            claude/update-syntax-archive-vm7Nl \
            claude/integrate-files-MoL5y \
            claude/pregnancy-timeline-chart-2m6guo \
          ; do
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$b" >/dev/null 2>&1; then
              echo "deleted: $b"
            else
              echo "skip/failed: $b"
            fi
          done
